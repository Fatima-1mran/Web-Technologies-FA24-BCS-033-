<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Ray-Ban</title>
  </head>
  <body>
    <header class="site-header">
      <div class="top-bar">
        <div class="top-bar-item-1">
          Enjoy free standard shipping on all orders
        </div>
        <div class="top-bar-item-2">OUR SERVICES &amp; EYE EXAM</div>
      </div>
    </header>

    <div class="navigation-bar">
      <img class="brand-logo" src="assets/logo.svg" alt="Ray-Ban logo" />
      <div class="nav-links">
        <a href="#">NEW IN</a>
        <a href="#">SUNGLASSES</a>
        <a href="#">EYEGLASSES</a>
        <a class="promo" href="#">PROMO</a>
      </div>
      <img class="search-icon" src="assets/search.svg" alt="Search icon" />
      <img class="user-icon" src="assets/user.svg" alt="User icon" />
      <img class="cart-icon" src="assets/shopping-bag.svg" alt="Cart icon" />
      <img class="menu-icon" src="assets/menu.svg" alt="Menu icon" />
    </div>

    <div class="discount-banner">
      <a href="#">GET UPTO 50% OFF ON SELECTED STYLES</a>
    </div>

    <div class="hero-section">
      <img class="hero-image" src="assets/Main-img.avif" alt="Hero image" />
    </div>
  </body>
</html>
