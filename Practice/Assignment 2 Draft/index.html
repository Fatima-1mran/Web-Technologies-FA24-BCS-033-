<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Ray-Ban</title>
  </head>
  <body>
    <header class="site-header">
      <div class="top-bar">
        <div class="top-bar-item-1">
          Enjoy free standard shipping on all orders
        </div>
        <div class="top-bar-item-2">OUR SERVICES &amp; EYE EXAM</div>
      </div>
    </header>
    <div class="sticky-bar">
      <div class="navigation-bar">
        <img class="brand-logo" src="assets/logo.svg" alt="Ray-Ban logo" />
        <div class="nav-links">
          <a href="#">NEW IN</a>
          <a href="#">SUNGLASSES</a>
          <a href="#">EYEGLASSES</a>
          <a class="promo" href="#">PROMO</a>
        </div>
        <img class="search-icon" src="assets/search.svg" alt="Search icon" />
        <img class="user-icon" src="assets/user.svg" alt="User icon" />
        <img class="cart-icon" src="assets/shopping-bag.svg" alt="Cart icon" />
        <img class="menu-icon" src="assets/menu.svg" alt="Menu icon" />
      </div>

      <div class="discount-banner">
        <a href="#">GET UPTO 50% OFF ON SELECTED STYLES</a>
      </div>
    </div>
    <div class="main-section">
      <a href="https://example.com">
        <img
          class="main-image"
          src="assets/Main-img.avif"
          alt="Explore the collection"
        />
      </a>
      <div class="main-content">
        <h1>MEET YOUR NEW MUST-HAVE</h1>
        <button class="main-cta" type="button">SHOP NEW ARRIVALS</button>
      </div>
    </div>

    <div class="image-menu">

    <div class="Women-link">
      <a href="https://example.com">
        <img
          class="Women-img"
          src="assets/Women.avif"
          alt="Explore the women collection"
        />
      </a>
      <h2>WOMEN</h2>
      </div>

      <div class="Men-link">
         <a href="https://example.com">
        <img
          class="Men-img"
          src="assets/Men.avif"
          alt="Explore the men collection"
        />  
        </a>
        <h2>MEN</h2>
        </div>

           <div class="Men-link">
         <a href="https://example.com">
        <img
          class="Men-img"
          src="assets/Kids.avif"
          alt="Explore the kids collection"
        />  
        </a>
        <h2>KIDS</h2>
        </div>



      </div>
    </div>
  </body>
</html>
